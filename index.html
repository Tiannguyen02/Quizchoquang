<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz: Anh nhớ em được bao nhiêu?</title>
<style>
:root{--bg:#fff5f7;--card:#fff;--tx:#3a2a30;--mute:#8a7078;--ac:#e8577d;--ok:#2e9e6b;--okbg:#e4f6ec;--no:#d64545;--nobg:#fde8e8;--bd:#f2d5dc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1418;--card:#2a1d23;--tx:#f6e9ed;--mute:#b99aa5;--ac:#ff7a9c;--ok:#5fd09a;--okbg:#1c3a2c;--no:#ff7b7b;--nobg:#432127;--bd:#4a3039}}
:root[data-theme="dark"]{--bg:#1d1418;--card:#2a1d23;--tx:#f6e9ed;--mute:#b99aa5;--ac:#ff7a9c;--ok:#5fd09a;--okbg:#1c3a2c;--no:#ff7b7b;--nobg:#432127;--bd:#4a3039}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center}
.wrap{width:100%;max-width:480px;padding:20px 16px 40px}
h1{font-size:22px;margin:8px 0 4px;text-align:center}
.sub{text-align:center;color:var(--mute);font-size:14px;margin-bottom:20px}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.cnt{font-size:13px;color:var(--mute);margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px}
.q{font-size:19px;font-weight:600;line-height:1.35;margin:0 0 16px}
.opt{display:block;width:100%;text-align:left;padding:14px;margin-bottom:10px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;cursor:pointer;font-family:inherit}
.opt:active{transform:scale(.98)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--no);background:var(--nobg)}
.opt:disabled{cursor:default}
.fb{margin:6px 0 0;font-size:14px;min-height:20px}
.next{display:none;width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.big{font-size:56px;text-align:center;margin:10px 0}
.score{font-size:34px;font-weight:700;text-align:center;color:var(--ac)}
.msg{text-align:center;line-height:1.5;margin:10px 0 18px}
</style>
</head>
<body>
<div class="wrap">
  <h1>💛 Anh nhớ em được bao nhiêu? 💛</h1>
  <div class="sub">Chọn đáp án đúng nhé!</div>
  <div class="bar"><i id="bar"></i></div>
  <div class="cnt" id="cnt"></div>
  <div class="card" id="card"></div>
</div>
<script>
const Q=[
{q:"Em đeo vòng tay màu gì?",o:["Màu bạc","Màu vàng","Màu đen","Màu hồng"],a:1},
{q:"Em có bao nhiêu piercing?",o:["2","3","4","6"],a:2,note:"Thật ra là 5 cơ 😏"},
{q:"Hôm mình gặp nhau ở IKEA, em mua gì?",o:["Khung ảnh","Đèn bàn","Kệ sách","Cửa kính"],a:3},
{q:"Hôm ở Väla em uống gì?",o:["Cappuccino","Matcha","Latte","Americano"],a:2},
{q:"Biển số xe của em là bao nhiêu?",o:["CGH 243","CGM 234","CHG 234","CGH 234"],a:3},
{q:"Tên bài hát tiếng Anh trong “our playlist” là gì?",o:["2 soon – Keshi","Beside You – Keshi","Blue – Keshi","Drunk – Keshi"],a:0},
{q:"Hôm mình gặp nhau spontan, em mặc đồ màu gì?",o:["Trắng","Xanh navy","Be","Đen full black"],a:3},
{q:"Hành động đầu tiên khi em gặp anh ở IKEA là gì?",o:["Ôm anh","Vẫy tay chào","Né anh","Chạy lại chỗ anh"],a:2}
];
let i=0,s=0;
const card=document.getElementById('card'),bar=document.getElementById('bar'),cnt=document.getElementById('cnt');
function show(){
  const d=Q[i];
  bar.style.width=(i/Q.length*100)+'%';
  cnt.textContent='Câu '+(i+1)+'/'+Q.length;
  card.innerHTML='<p class="q"></p><div id="opts"></div><p class="fb" id="fb"></p><button class="next" id="nx"></button>';
  card.querySelector('.q').textContent=d.q;
  const box=document.getElementById('opts');
  d.o.forEach((t,k)=>{
    const b=document.createElement('button');
    b.className='opt';b.textContent=t;
    b.onclick=()=>pick(k);
    box.appendChild(b);
  });
}
function pick(k){
  const d=Q[i],bs=document.querySelectorAll('.opt'),fb=document.getElementById('fb'),nx=document.getElementById('nx');
  bs.forEach((b,j)=>{b.disabled=true;if(j===d.a)b.classList.add('ok');});
  if(k===d.a){s++;fb.style.color='var(--ok)';fb.textContent='Đúng rồi! 🥰'+(d.note?' '+d.note:'');}
  else{bs[k].classList.add('no');fb.style.color='var(--no)';fb.textContent='Ơ sai rồi 🙈'+(d.note?' '+d.note:'');}
  nx.style.display='block';
  nx.textContent=i<Q.length-1?'Câu tiếp theo →':'Xem kết quả';
  nx.onclick=()=>{i++;i<Q.length?show():end();};
}
function end(){
  bar.style.width='100%';cnt.textContent='Hoàn thành!';
  const r=s/Q.length;
  const m=r===1?'Em nhớ hết luôn! Anh biết mà 🥹💛':r>=0.7?'Giỏi lắm, em nhớ khá nhiều nè 😘':r>=0.4?'Cũng được, nhưng em cần ôn lại kỷ niệm của mình nha 😆':'Hmm… em phải đi gặp anh để ôn bài thôi 😏';
  card.innerHTML='<div class="big">'+(r>=0.7?'🎉':'💌')+'</div><div class="score">'+s+' / '+Q.length+'</div><p class="msg"></p><button class="next" style="display:block" id="rs">Làm lại</button>';
  card.querySelector('.msg').textContent=m;
  document.getElementById('rs').onclick=()=>{i=0;s=0;show();};
}
show();
</script>
</body>
</html>
